name: Build and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Pre-release checks
    uses: ./.github/workflows/ci.yml

  linux:
    name: Linux ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            triple: x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
            triple: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}-v040
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl clang musl-tools
      - name: Static musl CLI
        run: |
          mkdir -p dist
          export CC_${{ matrix.triple }}_unknown_linux_musl=musl-gcc
          cargo build --locked --release --target ${{ matrix.triple }}-unknown-linux-musl -p hermod-cli
          cp target/${{ matrix.triple }}-unknown-linux-musl/release/hermod dist/hermod-linux-${{ matrix.arch }}-musl
          if readelf -l dist/hermod-linux-${{ matrix.arch }}-musl | grep -q INTERP; then echo 'CLI is not static'; exit 1; fi
          dist/hermod-linux-${{ matrix.arch }}-musl --version
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} MSIX
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          flutter-version: '3.47.9'
          channel: stable
          architecture: x64
          cache: true
      - name: Bootstrap pinned Flutter with native ARM64 Dart
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') { throw 'ARM64 runner required' }
          $sdk = Join-Path $env:RUNNER_TEMP 'flutter-3.47.9-arm64'
          git clone --depth 1 --branch 3.47.9 https://github.com/flutter/flutter.git $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Pinned Flutter checkout failed' }
          # Flutter bootstraps dart-sdk-windows-arm64.zip on native ARM64 hosts.
          & "$sdk/bin/flutter.bat" --version
          if ($LASTEXITCODE -ne 0) { throw 'Native Flutter bootstrap failed' }
          $abi = & "$sdk/bin/dart.bat" flutter/scripts/tool_arch.dart
          if ($LASTEXITCODE -ne 0 -or ($abi -join "`n").Trim() -ne 'windows_arm64') {
            throw "Flutter bootstrap did not provide native ARM64 Dart: $($abi -join ' ')"
          }
          "$sdk/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "FLUTTER_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}-v040
      - name: Windows packaging regression tests
        shell: pwsh
        run: python -m unittest discover -s flutter/scripts -p 'test_*.py'
      - name: Flutter analysis and tests
        working-directory: flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build Flutter and package unsigned Microsoft Store MSIX
        shell: pwsh
        run: ./flutter/scripts/package-msix.ps1 -Architecture ${{ matrix.arch }} -OutputDirectory dist
      - name: Validate Store package
        run: python flutter/scripts/verify-msix.py dist/hermod-windows-${{ matrix.arch }}.msix ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-msix-${{ matrix.arch }}
          path: dist/hermod-windows-${{ matrix.arch }}.msix
          if-no-files-found: error

  windows_bundle:
    name: Windows x64 and ARM64 Store bundle
    needs: windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-msix-*
          path: packages
          merge-multiple: true
      - name: Bundle validated architectures for Microsoft Store
        shell: pwsh
        run: ./flutter/scripts/bundle-msix.ps1 -PackageDirectory packages -OutputDirectory dist
      - name: Validate complete Store bundle before release
        run: python flutter/scripts/verify-msix.py dist/hermod-windows.msixbundle --bundle
      - uses: actions/upload-artifact@v4
        with:
          name: store-windows
          path: dist/hermod-windows.msixbundle
          if-no-files-found: error

  release:
    name: Publish Linux CLI release
    needs: [verify, linux, windows_bundle]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - run: |
          python3 flutter/scripts/check-release-files.py artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Both peers need the same IPv4 LAN or reachable IPv6, plus signaling access. See README.md / README.zh-CN.md for setup and migration.
            Windows: install HermodTransfer from Microsoft Store (publisher FeelLiao, Store ID 9PMPWN3HMR3M). Windows updates are submitted automatically after this release succeeds.
            Linux: x64 / ARM64 static musl CLI.
            Windows: Flutter desktop GUI for x64 and ARM64, delivered as one Microsoft Store MSIXBundle.

  store:
    name: Submit Windows update to Microsoft Store
    needs: [release, windows_bundle]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: windows-2025
    timeout-minutes: 40
    concurrency:
      group: microsoft-store-submission
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: store-windows
          path: store-package
      - name: Install pinned Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@15abd1c50fcc164b19cb240fb04ef3c49bf715a2 # v1.1
        with:
          version: v0.4.3
      - name: Validate and submit the Store bundle
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
        run: python3 flutter/scripts/submit-store.py store-package/hermod-windows.msixbundle
