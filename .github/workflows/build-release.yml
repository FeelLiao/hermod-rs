name: Build and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Linux quality gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermod-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality-v040
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl clang libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: node scripts/check-release-version.mjs
      - run: npm ci && npm run build
        working-directory: hermod-app
      - run: npx playwright install --with-deps chromium && npm test
        working-directory: hermod-app
      - name: Local IPv6 test interface
        run: |
          sudo ip link add hermodtest type dummy
          sudo ip link set hermodtest up
          sudo ip -6 address add fd00:1234::1/64 dev hermodtest nodad
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  linux:
    name: Linux ${{ matrix.arch }} GUI and CLI
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            triple: x86_64
            appimage_arch: amd64
          - os: ubuntu-22.04-arm
            arch: arm64
            triple: aarch64
            appimage_arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermod-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}-v040
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl clang musl-tools libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xvfb xdotool
      - run: npm ci
        working-directory: hermod-app
      - name: AppImage
        working-directory: hermod-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --ci --bundles appimage -- --locked
      - name: Stage and launch AppImage
        run: |
          mkdir -p dist
          version=$(node -p "require('./hermod-app/package.json').version")
          cp "target/release/bundle/appimage/Hermod_${version}_${{ matrix.appimage_arch }}.AppImage" dist/hermod-linux-${{ matrix.arch }}.AppImage
          hermod-app/scripts/smoke-appimage.sh dist/hermod-linux-${{ matrix.arch }}.AppImage
      - name: Static musl CLI
        run: |
          export CC_${{ matrix.triple }}_unknown_linux_musl=musl-gcc
          cargo build --locked --release --target ${{ matrix.triple }}-unknown-linux-musl -p hermod-cli
          cp target/${{ matrix.triple }}-unknown-linux-musl/release/hermod dist/hermod-linux-${{ matrix.arch }}-musl
          if readelf -l dist/hermod-linux-${{ matrix.arch }}-musl | grep -q INTERP; then echo 'CLI is not static'; exit 1; fi
          dist/hermod-linux-${{ matrix.arch }}-musl --version
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }} MSIX
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Check fixed Windows signing secrets before building
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          $missing = @('WINDOWS_PFX_BASE64', 'WINDOWS_PFX_PASSWORD') | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing) { throw "Missing repository Actions secrets: $($missing -join ', '). Run hermod-app/scripts/init-signing-keys.sh once and configure Settings > Secrets and variables > Actions; see APP_BUILD.md." }
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermod-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.arch }}-v040
      - run: npm ci
        working-directory: hermod-app
      - name: Build native GUI
        working-directory: hermod-app
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: npm run tauri -- build --ci --target ${{ matrix.target }} --no-bundle -- --locked
      - name: Fixed test signing and package verification
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_PFX_BASE64 -or -not $env:WINDOWS_PFX_PASSWORD) { throw 'Missing fixed Windows signing secrets; see APP_BUILD.md' }
          $env:WINDOWS_PFX_PATH = Join-Path $env:RUNNER_TEMP 'hermod-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($env:WINDOWS_PFX_PATH, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
            ./hermod-app/scripts/package-msix.ps1 -BinaryDirectory target/${{ matrix.target }}/release -Architecture ${{ matrix.arch }}
          } finally { Remove-Item -LiteralPath $env:WINDOWS_PFX_PATH -Force -ErrorAction SilentlyContinue }
      - name: Ensure Microsoft WebView2 Runtime
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (-not (Get-ItemPropertyValue -Path $key -Name pv -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'WebView2 bootstrapper signature verification failed' }
            $process = Start-Process $installer -ArgumentList '/silent','/install' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'WebView2 installation failed' }
          }
      - name: Install and launch signed MSIX
        shell: powershell
        run: ./hermod-app/scripts/smoke-windows.ps1
      - name: Common attachments are published once
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: Remove-Item dist/Hermod-Test.cer, dist/Install-Hermod.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Android ARM64 APK
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check fixed Android signing secrets before building
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name//[[:space:]]/}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository Actions secrets: ${missing[*]}. Run hermod-app/scripts/init-signing-keys.sh once and configure Settings > Secrets and variables > Actions; see APP_BUILD.md."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermod-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-web-arm64-v040
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK and native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl clang
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes) >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Prepare Tauri Android shell
        working-directory: hermod-app
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          npm ci
          npm run tauri -- android init --ci --skip-targets-install
          node scripts/configure-android.mjs
      - name: Fixed signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing fixed Android signing secrets; see APP_BUILD.md}"
          : "${ANDROID_KEYSTORE_PASSWORD:?}" "${ANDROID_KEY_ALIAS:?}" "${ANDROID_KEY_PASSWORD:?}"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/hermod-signing.jks"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          (cd hermod-app && npm run tauri -- android build --ci --target aarch64 --apk --split-per-abi -- --locked)
          mkdir -p dist
          cp hermod-app/src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk dist/hermod-android-arm64.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs dist/hermod-android-arm64.apk
          "$ANDROID_HOME/build-tools/37.0.0/zipalign" -c -P 16 -v 4 dist/hermod-android-arm64.apk
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging dist/hermod-android-arm64.apk > "$RUNNER_TEMP/apk-manifest.txt"
          grep -q "sdkVersion:'34'" "$RUNNER_TEMP/apk-manifest.txt"
          grep -q "targetSdkVersion:'37'" "$RUNNER_TEMP/apk-manifest.txt"
          python3 hermod-app/scripts/verify-apk.py dist/hermod-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          path: dist/hermod-android-arm64.apk
          if-no-files-found: error

  release:
    name: Publish all verified programs
    needs: [verify, linux, windows, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - run: python3 scripts/check-release-files.py artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Both peers need reachable IPv6. See README.md / README.zh-CN.md for setup and migration.
            Windows: download the matching MSIX, Hermod-Test.cer and Install-Hermod.ps1 into one directory. Run the PowerShell installer as your normal user. A fixed test certificate is used; this is not a Microsoft Store package.
            Linux: AppImage GUI or static musl CLI, x64 / ARM64.
            Android: ARM64 APK, Android 14 or newer (API 34), target API 37. Export inbox files before uninstalling an older temporary-key build.
