# Build Hermod on Linux (musl, fully static) and Windows (MSVC, static CRT),
# and publish a GitHub Release whenever a `v*` tag is pushed.

name: build-and-release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: musl target -> fully static binary (no glibc dependency).
          # aws-lc-sys (rustls crypto) builds BoringSSL via CMake with musl-gcc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            bin: hermod
            out: hermod-linux-x86_64-musl
            rustflags: ""
            cc: musl-gcc

          # Windows: MSVC toolchain with static CRT (+crt-static).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin: hermod.exe
            out: hermod-windows-x86_64.exe
            rustflags: "-C target-feature=+crt-static"
            cc: ""

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins 1.99.0; make it the default so the added
      # target is installed for the exact pinned toolchain.
      - name: Install Rust (pinned) + target
        run: |
          rustup default 1.99.0
          rustup target add ${{ matrix.target }}

      # Linux static build deps: musl-gcc, cmake (aws-lc-sys), perl, clang.
      - name: Install Linux static build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools cmake perl clang

      - name: Build (static)
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CC_x86_64_unknown_linux_musl: ${{ matrix.cc }}
        run: cargo build --release --target ${{ matrix.target }} -p hermod-cli

      - name: "Verify (Linux: statically linked)"
        if: matrix.os == 'ubuntu-latest'
        run: |
          file target/${{ matrix.target }}/release/${{ matrix.bin }}
          ldd target/${{ matrix.target }}/release/${{ matrix.bin }} 2>&1 || true

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.out }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}
          if-no-files-found: error

  build-android:
    name: build (Android ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned) + Android target
        run: |
          rustup default 1.99.0
          rustup target add aarch64-linux-android

      # aws-lc-sys 用 CMake 编 BoringSSL，需要 cmake/perl/clang
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl clang

      # NDK r29 = Android 16 / API 36 对应的 NDK。
      # 用 runner 预装的 sdkmanager（setup-android 会装已下架的 tools 包而失败）。
      - name: Install Android NDK r29
        run: |
          # runner 预装 SDK；优先用 ANDROID_HOME，否则回退到标准路径
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;29.0.14206865"

      - name: Configure Android toolchain
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/29.0.14206865"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # API 24（Android 7+）；想只支持 Android 16 就把 24 改成 36
          API=24
          {
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
            echo "ANDROID_NDK=$NDK"
            # 显式给 CMake 的 NDK toolchain / 平台，减少 aws-lc-sys 交叉编译失败
            echo "CMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake"
            echo "ANDROID_PLATFORM=android-${API}"
            echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android${API}-clang"
            echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android${API}-clang++"
            echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android${API}-clang"
          } >> "$GITHUB_ENV"

      - name: Build (Android ARM64)
        env:
          CARGO_TERM_COLOR: always
        run: cargo build --release --target aarch64-linux-android -p hermod-cli

      - name: Verify binary
        run: file target/aarch64-linux-android/release/hermod

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/aarch64-linux-android/release/hermod dist/hermod-android-aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: hermod-android-aarch64
          path: dist/hermod-android-aarch64
          if-no-files-found: error

  release:
    needs: [build, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
