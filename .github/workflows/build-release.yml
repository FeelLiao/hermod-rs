name: build-and-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Quality gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermod-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl clang libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: node scripts/check-release-version.mjs
      - run: npm ci
        working-directory: hermod-app
      - run: npm run build
        working-directory: hermod-app
      - run: npx playwright install --with-deps chromium
        working-directory: hermod-app
      - run: npm test
        working-directory: hermod-app
      - name: Local IPv6 test interface
        run: |
          sudo ip link add hermodtest type dummy
          sudo ip link set hermodtest up
          sudo ip -6 address add fd00:1234::1/64 dev hermodtest nodad
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  cli:
    name: CLI (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            binary: hermod
            artifact: hermod-linux-x86_64-musl
            rustflags: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: hermod.exe
            artifact: hermod-windows-x86_64.exe
            rustflags: '-C target-feature=+crt-static'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: cli-${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake perl clang
      - name: Build existing command-line artifact
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p hermod-cli
      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} dist/${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  desktop:
    name: GUI (${{ matrix.label }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            bundles: ''
          - os: macos-15-intel
            label: macos-x86_64
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            label: macos-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermod-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui-${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl clang libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - run: npm ci
        working-directory: hermod-app
      - name: Build Linux / macOS installers
        if: runner.os != 'Windows'
        working-directory: hermod-app
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Build Windows application
        if: runner.os == 'Windows'
        working-directory: hermod-app
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: npm run tauri -- build --ci --target x86_64-pc-windows-msvc --no-bundle -- --locked
      - name: Package portable Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows-zip.ps1 -BinaryDirectory target/x86_64-pc-windows-msvc/release
      - name: Stage Linux packages
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/appimage/*.AppImage dist/hermod-linux-x86_64.AppImage
      - name: Stage unnotarized macOS packages
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bundle/dmg/*.dmg dist/hermod-${{ matrix.label }}-unnotarized.dmg
          tar -czf dist/hermod-${{ matrix.label }}-unnotarized.app.tar.gz -C target/${{ matrix.target }}/release/bundle/macos Hermod.app
          codesign --verify --deep --strict target/${{ matrix.target }}/release/bundle/macos/Hermod.app
      - uses: actions/upload-artifact@v4
        with:
          name: release-gui-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  android:
    name: Android ARM64 APK + existing CLI
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermod-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK and NDK
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl clang
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" --licenses < <(yes) >/dev/null
          "$sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: hermod-app
      - name: Generate Android project
        working-directory: hermod-app
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          node ../scripts/configure-android.mjs
      - name: Build release APK
        working-directory: hermod-app
        run: npm run tauri -- android build --ci --apk --target aarch64
      - name: Sign and verify test APK
        run: scripts/sign-android-test.sh
      - name: Build existing Android CLI
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ env.ANDROID_NDK_HOME }}/build/cmake/android.toolchain.cmake
          ANDROID_PLATFORM: android-24
        run: |
          cargo build --release --locked --target aarch64-linux-android -p hermod-cli
          cp target/aarch64-linux-android/release/hermod dist/hermod-android-aarch64
      - uses: actions/upload-artifact@v4
        with:
          name: release-android-arm64
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish all verified artifacts
    needs: [cli, desktop, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Windows GUI: extract hermod-windows-x86_64.zip and run hermod-app.exe (unsigned; WebView2 required).
            For Microsoft Store submission, use the included Store tools to create an unsigned MSIX with your Partner Center identity; ZIP itself is not a Store package.
            Android APK uses a new test signing key on each build; export your inbox before uninstalling an older test APK.
            macOS apps are ad-hoc signed and NOT notarized. Linux GUI is distributed only as AppImage and requires a compatible desktop.
            All existing CLI artifacts are included. SHA256SUMS covers every package.
            Both peers need reachable IPv6; this release does not add IPv4 traversal or a file relay.
