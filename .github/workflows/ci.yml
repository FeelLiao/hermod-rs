name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Linux quality gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality-v040
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl clang
      - run: node flutter/scripts/check-release-version.mjs
      - run: python3 -m unittest flutter/scripts/test_store_submission.py
      - run: python3 flutter/android/test_static_contract.py
      - run: python3 flutter/scripts/check-unsafe-free.py
      - run: bash -n flutter/scripts/build-android.sh
      - name: Flutter quality gates
        working-directory: flutter
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Docs must build without warnings
        env:
          RUSTDOCFLAGS: '-D warnings'
        run: cargo doc --no-deps --locked
      - name: Supply chain policy (licenses and advisories)
        uses: EmbarkStudios/cargo-deny-action@v2
