name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Linux quality gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermod-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: quality-v040
      - name: Native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake perl clang libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: node scripts/check-release-version.mjs
      - run: npm ci && npm run build
        working-directory: hermod-app
      - run: npx playwright install --with-deps chromium && npm test
        working-directory: hermod-app
      - name: Local IPv6 test interface
        run: |
          sudo ip link add hermodtest type dummy
          sudo ip link set hermodtest up
          sudo ip -6 address add fd00:1234::1/64 dev hermodtest nodad
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
