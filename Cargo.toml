[workspace]
resolver = "3"
members = ["hermod-core", "hermod-cli", "hermod-app/src-tauri", "hermod-app/plugins/documents"]
default-members = ["hermod-core", "hermod-cli"]

[workspace.package]
version = "0.4.5"
edition = "2024"
rust-version = "1.99.0"

# 工作区统一禁止手写 unsafe；Clippy 警告作为错误处理。
[workspace.lints.rust]
unsafe_code = "forbid"

# clippy 是 Rust 官方的"代码体检工具"，它能抓编译器（rustc）不报的问题，是保证代码质量的第一道自动化防线。
[workspace.lints.clippy]
all = "deny"
