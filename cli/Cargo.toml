[package]
name = "hermod-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
# 所有逻辑都在 hermod-core（D17），CLI 只做参数解析与调度。
hermod-core = { path = "../core" }

# 参数解析
clap = { version = "4", features = ["derive"] }

# 异步运行时 + Ctrl+C + 超时
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }

# 进度条与终端颜色/tty 检测
indicatif = "0.17"
console = "0.15"

# 生成传输码的随机源（已在 core 依赖树里）
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }

# 结构化日志，级别由 CLI 的 --verbose 控制
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

# Native ACL FFI is confined to src/windows.rs; all other CLI code denies unsafe.
[lints.rust]
unsafe_code = "deny"
[lints.clippy]
all = "deny"

[[bin]]
name = "hermod"
path = "src/main.rs"

[dev-dependencies]
# GUI 互通测试直接使用 Flutter 桥接 crate 的应用层 Engine。
hermod-flutter-bridge = { path = "../flutter-bridge" }
tokio = { version = "1", features = ["process", "io-util"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
serde_json = "1"
