[package]
name = "hermod-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11"
# 已在依赖树里（经 pem-rfc7468）；信令 payload 与 Go 一致用 base64 字符串。
base64ct = "1"
crypto-bigint = "0.7"
# X.509 DER 解析（tls.rs 提取 SPKI 指纹用，已在依赖树里）。
der = "0.8"
getrandom = { version = "0.4", features = ["sys_rng"] }
hkdf = "0.13"
p256 = { version = "0.14", features = ["ecdh", "hash2curve"] }
rand_core = "0.10"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync"] }
tokio-tungstenite = "0.30"

[lints]
workspace = true
