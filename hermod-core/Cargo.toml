[package]
name = "hermod-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11"
# 已在依赖树里（经 pem-rfc7468）；信令 payload 与 Go 一致用 base64 字符串。
base64ct = "1"
boringtun = "0.7.1"
crypto-bigint = "0.7"
# X.509 DER 解析（tls.rs 提取 SPKI 指纹用，已在依赖树里）。
der = "0.8"
# WebSocket 流的 Sink/Stream 扩展（tokio-tungstenite 已依赖，无需下载）。
futures-util = "0.3"
getrandom = { version = "0.4", features = ["sys_rng"] }
hkdf = "0.13"
if-addrs = "0.15.0"
p256 = { version = "0.14", features = ["ecdh", "hash2curve"] }
rand_core = "0.10"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.11"
smoltcp = { version = "0.14.0", features = ["medium-ip", "socket-tcp-cubic"] }
# IPv6-only UDP 绑定（tokio 已依赖，已在树里）。
socket2 = "0.6"
subtle = "2"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "sync", "fs"] }
# 需要 rustls 集成以传入自定义 ClientConfig 做 SPKI pinning。
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
# 注意：x25519 密钥类型统一用 `boringtun::x25519` 的再导出（x25519-dalek 2.0.1，
# 与 Tunn::new 同类型）。不要再加不同版本的 x25519-dalek 直接依赖。

[lints]
workspace = true
