[package]
name = "hermod-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
aes-gcm = "0.11.1"
# 已在依赖树里（经 pem-rfc7468）；信令 payload 与 Go 一致用 base64 字符串。
base64ct = "1.8.3"
crypto-bigint = "0.7.5"
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hkdf = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh", "hash2curve"] }
rand_core = "0.10.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.21"

[lints]
workspace = true
